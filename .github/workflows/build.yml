name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выложить сборки в пре-релиз preview-<номер запуска>'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FFMPEG_VERSION: '7.1.1'
  SDL2_VERSION: '2.30.11'

jobs:
  # Ядро + тесты + приложение под Linux x64, синтетическое видео для проверки
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # установка пакетов иногда зависает на зеркалах — ограничиваем время и повторяем
      - name: Пакеты
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            cmake ninja-build pkg-config ffmpeg libsdl2-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev
      - name: Python-пакеты
        timeout-minutes: 10
        run: pip install --quiet --timeout 60 --retries 3 numpy opencv-python-headless
      - name: Ядро и тесты
        run: |
          cmake -S native -B build-native -G Ninja
          cmake --build build-native
          ./build-native/test_kernels
      - name: Приложение
        run: |
          cmake -S app -B build-app -G Ninja
          cmake --build build-app
      - name: Синтетическое видео 16 Мп с разметкой
        run: |
          mkdir -p sample
          python detector/synth_sky.py --out sample/sky16mp.mp4 --frames 60
      - name: Совпадение с Python-прототипом
        env: { DRONOLOK_LIB: build-native }
        run: python native/python/compare_with_python.py sample/sky16mp.mp4 --frames 10
      - name: Замер
        run: |
          ffmpeg -loglevel error -i sample/sky16mp.mp4 -frames:v 20 -pix_fmt gray -f yuv4mpegpipe - | ./build-native/dronolok_bench - --frames 20 --sweep
          ./build-app/dronolok_app --bench sample/sky16mp.mp4 --preload 60 --frames 240 --json bench-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: sample-video
          path: sample/
          retention-days: 14

  # Windows x64: кросс-компиляция MinGW, всё статически в один .exe
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config nasm mingw-w64 
      - name: Кэш FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-mingw
          key: ffmpeg-mingw-${{ env.FFMPEG_VERSION }}-${{ hashFiles('app/scripts/build_ffmpeg_mingw.sh') }}
      - name: FFmpeg (статический, только декодеры)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz | tar xJ -C "$RUNNER_TEMP"
          app/scripts/build_ffmpeg_mingw.sh "$RUNNER_TEMP/ffmpeg-${FFMPEG_VERSION}" ~/ffmpeg-mingw
          rm -rf ~/ffmpeg-mingw.build
      - name: SDL2
        run: |
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz | tar xz -C "$RUNNER_TEMP"
      - name: Сборка
        run: |
          export PKG_CONFIG_LIBDIR=$HOME/ffmpeg-mingw/lib/pkgconfig
          cmake -S app -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/native/cmake/mingw-w64-x86_64.cmake \
            -DSDL2_DIR=$RUNNER_TEMP/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/lib/cmake/SDL2 \
            -DDRONOLOK_TESTS=ON
          cmake --build build-win
      - name: Упаковка
        run: |
          d=Dronolok-win64
          mkdir -p $d
          cp build-win/Dronolok.exe build-win/native/dronolok_bench.exe build-win/native/dronolok.dll $d/
          cp app/README.md $d/README.md
          cp native/include/dronolok/dronolok.h native/python/dronolok_native.py $d/
          x86_64-w64-mingw32-objdump -p $d/Dronolok.exe | grep -i "DLL Name" | sort -u
          mkdir -p win-tests && cp build-win/native/test_kernels.exe win-tests/
      - uses: actions/upload-artifact@v4
        with:
          name: Dronolok-win64
          path: Dronolok-win64/
      - uses: actions/upload-artifact@v4
        with:
          name: win-tests
          path: win-tests/
          retention-days: 7

  # Проверка .exe на настоящей Windows
  windows-smoke:
    needs: [linux, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Dronolok-win64, path: app }
      - uses: actions/download-artifact@v4
        with: { name: win-tests, path: tests }
      - uses: actions/download-artifact@v4
        with: { name: sample-video, path: sample }
      - name: Тесты ядер (SSE2/AVX2 на реальном CPU)
        run: ./tests/test_kernels.exe
      - name: Dronolok.exe --bench
        shell: pwsh
        run: |
          $p = Start-Process -FilePath app/Dronolok.exe -ArgumentList '--bench','sample/sky16mp.mp4','--preload','60','--frames','240','--json','bench-win.json' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          Get-Content bench-win.json
          $p = Start-Process -FilePath app/Dronolok.exe -ArgumentList '--bench','sample/sky16mp.mp4','--frames','60','--threads','2','--isa','sse2','--json','bench-win-2t.json' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          Get-Content bench-win-2t.json

  # Raspberry Pi: ядро под aarch64 (Pi 3/4/5, 64-бит ОС) и armhf (32-бит ОС), тесты в qemu
  pi:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - triple: aarch64-linux-gnu
            qemu: qemu-aarch64-static
          - triple: arm-linux-gnueabihf
            qemu: qemu-arm-static
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-user-static g++-${{ matrix.triple }}
      - name: Сборка и тесты NEON
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/native/cmake/${{ matrix.triple }}.cmake
          cmake --build build
          ${{ matrix.qemu }} -L /usr/${{ matrix.triple }} build/test_kernels
          d=dronolok-${{ matrix.triple }}
          mkdir -p $d && cp build/dronolok_bench build/libdronolok.so native/include/dronolok/*.h* native/python/dronolok_native.py $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: dronolok-${{ matrix.triple }}
          path: dronolok-${{ matrix.triple }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [windows, windows-smoke, pi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Архивы
        run: |
          cd dist
          zip -r Dronolok-win64.zip Dronolok-win64
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('preview-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Дронолок preview {0}', github.run_number) }}
          files: |
            dist/Dronolok-win64.zip
            dist/dronolok-*/dronolok-*.tar.gz
