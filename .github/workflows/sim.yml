name: sim

# Виртуальная сцена (Godot 4.3): рендер роликов с разметкой и прогон конвейера по ним.
# Рендер программный (xvfb + llvmpipe), видеокарта не нужна.
on:
  push:
    paths: ['sim/**', '.github/workflows/sim.yml', 'app/src/twocam*', 'app/src/scenelink*']
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Сцены из sim/scenes через пробел; сцена:сектор — камера на сектор'
        default: 'forest_polyhaven drone_types city_sectors:forest city_sectors:lowrise city_sectors:highrise'
      seconds:
        description: 'Длина роликов, с (пусто — как в сцене)'
        default: ''

permissions:
  contents: write   # превью кладутся в ветку sim-previews (артефакты из сессий Claude не скачать)

# Godot: сумма архива снята при первой загрузке 2026-10-29 (подпись не проверялась).
env:
  GODOT_VERSION: '4.3-stable'
  GODOT_SHA256: '7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21'

jobs:
  # Галерея погоды и времени суток: по кадру на погоду в одном мире, короткие ролики дождя и снега.
  # Отдельно от рендера сцен — кадры приходят через несколько минут.
  weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GALLERY: >-
        scene;clear@12;cumulus@15;cumulus@17.5@250;clear@18.1@265;clear@18.6@265;clear@19.2@270;clear@23@300;
        overcast@22@300;cloudy@6.3@95;clear@18.3@90;overcast@11;haze@10@140;mist@8;fog@9;rain@14;storm@16@270;snow@12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip -d godot-bin
          echo "GODOT=$PWD/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Проверка скрипта
        run: |
          timeout 300 "$GODOT" --headless --path sim/godot --import || true
          timeout 120 "$GODOT" --headless --path sim/godot --check-only --script res://sim.gd
      - name: Пакеты
        timeout-minutes: 25
        run: |
          .github/scripts/apt.sh xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 \
            ffmpeg cmake ninja-build pkg-config libsdl2-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev
      - name: Python-пакеты
        timeout-minutes: 10
        run: pip install --quiet --timeout 60 --retries 3 numpy==2.5.4 opencv-python-headless==5.0.0.93
      - name: Галерея
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p wx
          g=$(echo "$GALLERY" | tr -d ' \n')
          xvfb-run -a -s "-screen 0 640x480x24" python sim/render.py --scene sim/scenes/city_sectors.json --out wx/gallery \
            --gallery "$g" 2>&1 | tee wx/log.txt
          # ошибки шейдеров Godot печатает, но не падает
          ! grep -E "SHADER ERROR|Parse Error|SCRIPT ERROR" wx/log.txt
      - name: Ролики дождя, снега и смены погоды
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for v in "rain --time 15" "snow --time 12" "storm --time 18.3 --az 265"; do
            set -- $v; n=$1; shift
            xvfb-run -a -s "-screen 0 640x480x24" python sim/render.py --scene sim/scenes/city_sectors.json --out wx/$n \
              --weather $n "$@" --seconds 1 --scale 0.5 --noise 0 --keep-png
            python sim/preview.py wx/$n 0
          done
          # смена погоды по ходу ролика и время суток x600: сцена weather_change
          xvfb-run -a -s "-screen 0 640x480x24" python sim/render.py --scene sim/scenes/weather_change.json --out wx/change \
            --scale 0.25 --noise 0 --keep-png
          python - <<'PY'
          import cv2, glob, numpy as np
          fs = sorted(glob.glob("wx/change/wide/*.png"))
          pick = [fs[int(i * (len(fs) - 1) / 7)] for i in range(8)]
          im = [cv2.resize(cv2.imread(f), (384, 288)) for f in pick]
          cv2.imwrite("wx/change/strip.jpg", np.vstack([np.hstack(im[:4]), np.hstack(im[4:])]), [cv2.IMWRITE_JPEG_QUALITY, 85])
          PY
      - name: Эмулятор двух камер с погодой из приложения (дождь, 18:30)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          cmake -S app -B build-app -G Ninja > /dev/null
          cmake --build build-app > /dev/null
          echo "== эмулятор: city_sectors, лес, дождь, 18:30 (погода в hello от приложения)" | tee wx/twocam.txt
          timeout 1500 xvfb-run -a -s "-screen 0 640x480x24" ./build-app/dronolok_app --twocam --scene sim/scenes/city_sectors.json \
            --sector forest --godot "$GODOT" --seconds 3 --wide 1152x864 --fps 30 --drones 3 --birds 1 --range 150,350 --size 1.5 \
            --switch queue --weather rain --time 18:30 --json wx/twocam-rain.json 2>&1 | tee -a wx/twocam.txt
          grep -q "погода: rain" wx/twocam.txt   # сцена приняла погоду от приложения
      - name: Превью в ветку sim-previews
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 1 --branch sim-previews "$REPO_URL" previews || \
            { mkdir previews && git -C previews init -q && git -C previews checkout -q -b sim-previews; }
          d=previews/${GITHUB_SHA::7}/weather
          mkdir -p "$d"
          cp wx/log.txt wx/gallery/gallery.jpg wx/gallery/gallery.json "$d"/ 2>/dev/null || true
          cp wx/change/strip.jpg "$d"/change_strip.jpg 2>/dev/null || true
          cp wx/twocam.txt wx/twocam-rain.json "$d"/ 2>/dev/null || true
          for n in rain snow storm change; do
            [ -d wx/$n ] || continue
            cp wx/$n/preview_wide_0.jpg "$d/${n}_wide.jpg" 2>/dev/null || true
            cp wx/$n/wide/f_000000.png "$d/${n}_wide_full.png" 2>/dev/null || true
            cp wx/$n/fine/f_000000.png "$d/${n}_fine.png" 2>/dev/null || true
            cp wx/$n/*_wide.mp4 "$d/${n}_wide.mp4" 2>/dev/null || true
          done
          cd previews
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "погода ${GITHUB_SHA::7}" || exit 0
          for i in 1 2 3; do
            git push -q "$REPO_URL" HEAD:sim-previews && break
            git -c user.name=ci -c user.email=ci@localhost pull -q --rebase "$REPO_URL" sim-previews
          done

  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # рендер ~55–65 мин (небо с погодой дороже) + эмулятор ~35 мин
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip -d godot-bin
          echo "GODOT=$PWD/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Проверка скрипта
        run: |
          timeout 300 "$GODOT" --headless --path sim/godot --import || true
          timeout 120 "$GODOT" --headless --path sim/godot --check-only --script res://sim.gd
      - name: Пакеты
        timeout-minutes: 35
        run: |
          .github/scripts/apt.sh xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 \
            ffmpeg cmake ninja-build pkg-config libsdl2-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev
      - name: Python-пакеты
        timeout-minutes: 10
        run: pip install --quiet --timeout 60 --retries 3 numpy==2.5.4 opencv-python-headless==5.0.0.93
      - name: Рендер
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SCENES: ${{ github.event.inputs.scenes }}
          SECS: ${{ github.event.inputs.seconds }}
        run: |
          scenes="$SCENES"; [ -z "$scenes" ] && scenes="quick city_sectors:forest city_sectors:lowrise city_sectors:highrise"
          secs="$SECS"
          mkdir -p vids
          for tok in $scenes; do
            sc=${tok%%:*}; sector=""; [ "$tok" != "$sc" ] && sector=${tok#*:}
            s=$sc; extra=(); [ -n "$secs" ] && extra=(--seconds "$secs")
            [ -n "$sector" ] && { s=${sc}_${sector}; extra+=(--sector "$sector"); }
            time xvfb-run -a -s "-screen 0 640x480x24" python sim/render.py --scene "sim/scenes/$sc.json" --out "out/$s" --keep-png "${extra[@]}"
            n=$(ls "out/$s/wide" | wc -l)
            python sim/preview.py "out/$s" 0
            python sim/preview.py "out/$s" $((n / 2))
            cp out/$s/*.mp4 out/$s/*.gt.json vids/
          done
          ls -la vids
          # панорама 360° сцен с секторами
          for sc in $(echo $scenes | tr ' ' '\n' | grep ':' | cut -d: -f1 | sort -u); do
            xvfb-run -a -s "-screen 0 640x480x24" python sim/render.py --scene "sim/scenes/$sc.json" --out "pano/$sc" --panorama
          done
      - name: Сводка разметки
        run: python sim/ci_report.py out | tee report.txt
      - name: Приложение
        run: |
          cmake -S app -B build-app -G Ninja
          cmake --build build-app
      - name: Эмулятор двух камер на 3D-сцене (Godot отдельным процессом)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          # программная отрисовка медленная (секунды на кадр): коротко и в малом разрешении
          for sec in forest highrise; do
            echo "== эмулятор: city_sectors, сектор $sec" | tee -a report.txt
            timeout 1500 xvfb-run -a -s "-screen 0 640x480x24" ./build-app/dronolok_app --twocam --scene sim/scenes/city_sectors.json \
              --sector $sec --godot "$GODOT" --seconds 3 --wide 1152x864 --fps 30 --drones 3 --birds 1 --range 150,350 --size 1.5 --switch queue --json twocam-$sec.json | tee -a report.txt
          done
          # две широкие камеры (вторая — третья камера сцены), цели летят через стык секторов
          echo "== эмулятор: две широкие, стык секторов" | tee -a report.txt
          timeout 1500 xvfb-run -a -s "-screen 0 640x480x24" ./build-app/dronolok_app --twocam --scene sim/scenes/city_sectors.json \
            --godot "$GODOT" --seconds 3 --wide 1152x864 --fps 30 --wides 2 --wide-step 110 --seam 1 --drones 3 --birds 0 \
            --range 150,350 --size 1.5 --json twocam-2wide.json | tee -a report.txt
          python -c "import json; d=json.load(open('twocam-2wide.json')); f=d['cam_frames']; assert d['wides']==2 and min(f)>=30, f; print('кадров по камерам', f)" | tee -a report.txt
          # птицы: широкая указывает и их (--with-birds), точная с зумом x4 отсеивает по силуэту; для сравнения — без силуэта
          for v in shape no-shape; do
            ex=(); [ $v = no-shape ] && ex=(--no-shape --no-veto-wide)
            echo "== эмулятор: птицы, зум x4, $v" | tee -a report.txt
            timeout 1500 xvfb-run -a -s "-screen 0 640x480x24" ./build-app/dronolok_app --twocam --scene sim/scenes/city_sectors.json \
              --sector forest --godot "$GODOT" --seconds 5 --wide 1152x864 --fps 30 --drones 1 --birds 4 --range 150,350 --fov 5 \
              --with-birds "${ex[@]}" --json twocam-birds-$v.json | tee -a report.txt
          done
      - name: Мультитест по роликам сцены
        run: |
          ./build-app/dronolok_app --multitest vids --parallel 2 --out mt-sim
          python sim/ci_report.py --multitest mt-sim/results.json | tee -a report.txt
      - name: Превью в ветку sim-previews
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 1 --branch sim-previews "$REPO_URL" previews || \
            { mkdir previews && git -C previews init -q && git -C previews checkout -q -b sim-previews; }
          d=previews/${GITHUB_SHA::7}
          mkdir -p "$d"
          cp report.txt mt-sim/results.json "$d"/
          for m in out/*/meta.json; do s=$(basename $(dirname $m)); mkdir -p "$d/$s"
            cp out/$s/*.jpg out/$s/*.png out/$s/*.gt.json out/$s/meta.json "$d/$s"/ 2>/dev/null || true
            # короткий фрагмент точной камеры (640x480) — посмотреть ведение
            ffmpeg -loglevel error -i out/$s/*_fine.mp4 -t 4 -c copy "$d/$s/fine_4s.mp4" || true
          done
          for p in pano/*/pano.jpg; do [ -f "$p" ] && cp "$p" "$d/pano_$(basename $(dirname $p)).jpg"; done
          cd previews
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "превью ${GITHUB_SHA::7}"
          # два прогона с разных веток пушат одновременно: папки разные (по SHA), догоняем и пушим снова
          for i in 1 2 3; do
            git push -q "$REPO_URL" HEAD:sim-previews && break
            git -c user.name=ci -c user.email=ci@localhost pull -q --rebase "$REPO_URL" sim-previews
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim-videos
          path: |
            vids/
            out/*/meta.json
            out/*/*.jpg
            out/*/targets_*.png
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim-multitest
          path: mt-sim/
          retention-days: 14
